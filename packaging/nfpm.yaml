# nfpm configuration for the daemonica .deb (SPEC §4.3).
# Built by `make package`; ARCH and VERSION are injected by the Makefile.
name: daemonica
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: "Daemonica maintainers <tnebert@gmail.com>"
description: |
  Web-based administration dashboard for a single Debian/Ubuntu server.
  Passkey-only login, privilege-separated helper, tamper-evident audit log.
license: "Proprietary (license to be decided)"
homepage: https://github.com/PanPakaPancake/daemonica
depends:
  - systemd
  - adduser
recommends:
  - ufw
  - tcpdump
contents:
  - src: ./dist/${ARCH}/daemonica-web
    dst: /usr/bin/daemonica-web
    file_info: {mode: 0755}
  - src: ./dist/${ARCH}/daemonica-helper
    dst: /usr/bin/daemonica-helper
    file_info: {mode: 0755}
  - src: ./dist/${ARCH}/daemonica-admin
    dst: /usr/sbin/daemonica-admin
    file_info: {mode: 0750}
  - src: ./packaging/systemd/daemonica-web.service
    dst: /usr/lib/systemd/system/daemonica-web.service
  - src: ./packaging/systemd/daemonica-helper.service
    dst: /usr/lib/systemd/system/daemonica-helper.service
  - src: ./README.md
    dst: /usr/share/doc/daemonica/README.md
  - src: ./docs/INSTALL.md
    dst: /usr/share/doc/daemonica/INSTALL.md
scripts:
  postinstall: ./packaging/maintainer-scripts/postinst
  preremove: ./packaging/maintainer-scripts/prerm
  postremove: ./packaging/maintainer-scripts/postrm
